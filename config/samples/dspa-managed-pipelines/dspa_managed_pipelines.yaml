# Sample DataSciencePipelinesApplication with managed pipelines.
#
# Managed pipelines are enabled by default when the field is omitted, including
# for existing DSPAs on upgrade. To opt out BEFORE upgrading, annotate the DSPA:
# datasciencepipelinesapplications.opendatahub.io/disable-managed-pipelines: "true"
# The API server pod runs an init
# container (init-managed-pipelines) that compiles bundled pipelines into a
# shared volume; the API server then exposes them like other sample pipelines.
# The image defaults to the operator's configured pipelines-components image.
# Null also follows the enabled default; use the annotation to disable them.
# Defaulting happens only in operator workload parameters, not in the stored DSPA.
# See ../../../docs/managed-pipelines.md for upgrade and opt-out instructions.
#
# Omitting managedPipelines.pipelines sets ALL_PIPELINES=true for the init image.
# To pin a subset, set pipelines: [ { name: <pipeline-name> }, ... ].
apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: sample
spec:
  dspVersion: v2
  apiServer:
    enableSamplePipeline: true
    cABundle:
      configMapKey: ca.crt
      configMapName: kube-root-ca.crt
    # Optional: omitting this field also enables all bundled managed pipelines.
    managedPipelines: {}
  objectStorage:
    # Need to enable this for artifact download links to work
    # i.e. for when requesting /apis/v2beta1/artifacts/{id}?share_url=true
    enableExternalRoute: true
    minio:
      deploy: true
      image: 'quay.io/opendatahub/minio:RELEASE.2019-08-14T20-37-41Z-license-compliance'
