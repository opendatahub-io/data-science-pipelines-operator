apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opendatahub
resources:
  - ../../base
  - ../../argo
  - ../../prometheus
  - webhook/cert-issuer.yaml
  - webhook/certificate.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dspo-parameters
    behavior: merge
    literals:
      - kube-rbac-proxy=quay.io/opendatahub/odh-kube-rbac-proxy:v3.6.0
patchesStrategicMerge:
  - img_patch.yaml
  - res_patch.yaml
  - user_patch.yaml
  - env_patch.yaml
  - prometheusrule_patch.yaml
images:
  - name: controller
    newName: quay.io/opendatahub/data-science-pipelines-operator
    newTag: main
replacements:
  - source:
      kind: Certificate
      name: dspa-webhook-cert
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          name: dspa-webhook-cert
        fieldPaths:
          - spec.dnsNames.1
          - spec.dnsNames.2
          - spec.dnsNames.3
        options:
          delimiter: '.'
          index: 1
