apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: datasciencepipelinesapplications-controller
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: WEBHOOK_ANNOTATIONS
              value: '{"cert-manager.io/inject-ca-from": "opendatahub/dspa-webhook-cert"}'
            # The platform operator injects APPLICATIONS_NAMESPACE into DSPO from
            # DSCI in managed deployments. CI runs DSPO standalone, so mirror that
            # here: MLflow AUTODETECT resolves the platform MLflow CR in this
            # namespace and the MLflow egress peers are scoped to it.
            - name: APPLICATIONS_NAMESPACE
              value: opendatahub
