apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dspa-webhook-cert
spec:
  commonName: dspa-webhook-cert
  isCA: false
  # The Kind overlay derives the namespace segment from metadata.namespace.
  dnsNames:
  - ds-pipelines-webhook
  - ds-pipelines-webhook.NAMESPACE
  - ds-pipelines-webhook.NAMESPACE.svc
  - ds-pipelines-webhook.NAMESPACE.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: dspa-webhook-selfsigned-issuer
    group: cert-manager.io
  secretName: ds-pipelines-webhook-tls
