apiVersion: monitoring.rhobs/v1
kind: ServiceMonitor
metadata:
  name: data-science-pipelines-operator-rhoai-service-monitor
  namespace: redhat-ods-monitoring
spec:
  namespaceSelector:
    matchNames:
      - redhat-ods-applications
  selector:
    matchLabels:
      app.kubernetes.io/name: data-science-pipelines-operator
  endpoints:
    - path: /metrics
      port: https
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        ca:
          configMap:
            name: prometheus-web-tls-ca
            key: service-ca.crt
        serverName: data-science-pipelines-operator-service.redhat-ods-applications.svc
