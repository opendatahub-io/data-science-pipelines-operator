apiVersion: v1
kind: ConfigMap
metadata:
  name: ds-pipeline-server-config-postgresql-custom-ca
data:
  config.json: |
    {
      "DBConfig": {
        "PostgreSQLConfig": {"DBName":"pipelines","ExtraParams":{"search_path":"\"pipeline_app\"","sslmode":"verify-full","sslrootcert":"/postgres-certs/postgres-ca.crt"},"Host":"postgres.example.com","Port":"6432","SkipDatabaseCreation":true,"User":"pipelines_user"},
        "ConMaxLifeTime": "120s"
      },
      "ObjectStoreConfig": {
        "PipelinePath": "pipelines"
      },
      "DBDriverName": "pgx",
      "ARCHIVE_CONFIG_LOG_FILE_NAME": "main.log",
      "ARCHIVE_CONFIG_LOG_PATH_PREFIX": "/artifacts",
      "InitConnectionTimeout": "6m"
    }
