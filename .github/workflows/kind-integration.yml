name: KinD DSPO/DSP Integration Tests

on:
  workflow_dispatch:
    inputs:
      baseline-image:
        description: 'Optional earlier modular DSPO image for upgrade/downgrade testing'
        type: string
      baseline-version:
        description: 'Platform version of the baseline (required with baseline-image)'
        type: string
      candidate-version:
        description: 'Newer platform version of this checkout (required with baseline-image)'
        type: string
  push:
    branches:
      - main
      - stable
      - v*.*.*
  pull_request:
    paths:
      - go.mod
      - go.sum
      - controllers/**
      - api/**
      - config/**
      - tests/**
      - .github/resources/**
      - .github/actions/**
      - '.github/workflows/kind-integration.yml'
      - '.github/scripts/build_dsp_images.sh'
      - '.github/scripts/tests/tests.sh'
      - '.github/scripts/tests/run_dsp_mlflow_tests.sh'
      - '.github/scripts/tests/collect_logs.sh'
      - '.github/scripts/tests/deploy_dspa.sh'
      - '.github/scripts/python_package_upload/**'
      - Makefile
    types:
      - opened
      - reopened
      - closed
      - synchronize

concurrency:
  group: ${{ github.head_ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  GIT_WORKSPACE: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  dspo-tests:
    name: DSPO integration (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, modular]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: go

      - name: Setup and start KinD cluster
        uses: ./.github/actions/kind

      - name: Build and push DSP images
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          .github/scripts/build_dsp_images.sh
        env:
          REGISTRY_ADDRESS: ${{ env.REGISTRY_ADDRESS }}
          PR_HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Free up disk space
        uses: kubeflow/pipelines/.github/actions/github-disk-cleanup@master

      - name: Run test
        id: test
        working-directory: ${{ github.workspace }}/.github/scripts/tests
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          if [ "$TEST_MODE" = modular ]; then
            bash tests.sh --kind --modular
          else
            bash tests.sh --kind
          fi
        continue-on-error: true

      - name: Test modular upgrade and downgrade
        id: test-upgrade
        if: matrix.mode == 'modular' && inputs.baseline-image != '' && steps.test.outcome == 'success'
        env:
          AIPIPELINES_BASELINE_IMAGE: ${{ inputs.baseline-image }}
          AIPIPELINES_BASELINE_VERSION: ${{ inputs.baseline-version }}
          AIPIPELINES_CANDIDATE_VERSION: ${{ inputs.candidate-version }}
        run: |
          export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
          make aipipelines-upgrade-test
        continue-on-error: true

      - name: Deploy MLflow
        id: deploy-mlflow
        uses: opendatahub-io/mlflow-operator/.github/actions/deploy@ec59b7c996ef4d14c448254132e21bd85fd1c28f
        with:
          namespace: opendatahub
          mlflow_image: quay.io/opendatahub/mlflow:odh-stable-490cd77b5b697a8ad0c5a84272983f668b961524
          mlflow_operator_image: quay.io/opendatahub/mlflow-operator:ec59b7c996ef4d14c448254132e21bd85fd1c28f
          backend_store: postgres
          artifact_storage: s3
          registry_store: postgres
          s3_access_key: minio
          s3_secret_key: minio123

      - name: Verify MLflow deployment
        if: ${{ steps.deploy-mlflow.outcome == 'success' }}
        run: |
          kubectl get mlflow mlflow -n opendatahub

      - name: Run DSP MLflow tests
        id: test-mlflow
        if: ${{ steps.deploy-mlflow.outcome == 'success' }}
        working-directory: ${{ github.workspace }}/.github/scripts/tests
        env:
          CONTAINER_CLI: podman
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123
        run: |
          bash tests.sh --skip-deploy --mlflow-only
        continue-on-error: true

      - name: Collect events and logs
        if: always() && (steps.test.outcome != 'success' || steps.test-upgrade.outcome == 'failure' || steps.deploy-mlflow.outcome != 'success' || steps.test-mlflow.outcome != 'success')
        working-directory: ${{ github.workspace }}/.github/scripts/tests
        run: |
          ./collect_logs.sh --dspa-ns test-dspa --dspo-ns opendatahub
          ./collect_logs.sh --dspa-ns dspa-ext --dspo-ns opendatahub
          ./collect_logs.sh --dspa-ns test-k8s-dspa --dspo-ns opendatahub
          ./collect_logs.sh --dspa-ns test-dspa-mlflow --dspo-ns opendatahub
          exit 1

      - name: Export cluster diagnostics
        if: failure()
        run: kind export logs /tmp/dspo-kind-logs --name cluster

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dspo-kind-${{ matrix.mode }}-logs
          path: /tmp/dspo-kind-logs
